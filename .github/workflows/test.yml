name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Install dependencies
        run: |
          go mod tidy

      - name: Install mockery
        run: |
          go install github.com/vektra/mockery/v2@v2.53.4

      - name: Generate mocks
        run: |
          make mock

      - name: Test
        run: |
          go test ./... -race
