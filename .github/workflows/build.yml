name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Install dependencies
        run: |
          go mod tidy

      - name: Build
        run: |
          go build ./cmd/api/main.go
